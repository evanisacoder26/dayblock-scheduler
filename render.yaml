# Render Blueprint for Dayblock (https://render.com/docs/blueprint-spec)
#
# Free plan = demo: Render wipes the disk on every deploy/restart and when the free
# instance sleeps (~15 min idle), so accounts and plans reset. To keep data, switch
# `plan` to `starter` and uncomment the disk + DATA_DIR below.

services:
  - type: web
    name: dayblock
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets: Render asks for these when you create the Blueprint. They are never stored in git.
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM          # optional, e.g. "Dayblock <codes@yourdomain.com>"; leave blank to use Resend's test sender
        sync: false
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: dayblock-data
    #   mountPath: /var/data
    #   sizeGB: 1
