<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Appearance: apply the saved Light/Dark choice before the page draws ("System" = follow the device). */(function(){function a(){try{var t=localStorage.getItem("dayblock.theme"),r=document.documentElement;if(t==="light"||t==="dark"){r.setAttribute("data-theme",t);r.setAttribute("data-theme-by","dayblock");}else if(r.getAttribute("data-theme-by")==="dayblock"){r.removeAttribute("data-theme");r.removeAttribute("data-theme-by");}}catch(e){}}a();window.addEventListener("storage",function(e){if(e.key==="dayblock.theme")a();});})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Account settings · Dayblock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app bar; a sticky section index on the left, settings cards stacked on the right. Index turns into a scrolling row on phones. */
:root {
  --bg: #f8fafc; --surface: #ffffff; --sunken: #f1f5f9; --line: #e2e8f0; --line-strong: #cbd5e1;
  --fg: #0f172a; --muted: #475569; --faint: #64748b;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff; --on-accent: #ffffff;
  --good: #047857; --good-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb; --bad: #b91c1c; --bad-soft: #fef2f2; --on-bad: #ffffff;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f1c; --surface: #111827; --sunken: #0d1424; --line: #1f2937; --line-strong: #334155;
    --fg: #f1f5f9; --muted: #a3b1c6; --faint: #8090a6;
    --accent: #818cf8; --accent-hover: #a5b4fc; --accent-soft: #1e1b4b; --on-accent: #0a0f1c;
    --good: #34d399; --good-soft: #052e22; --warn: #fbbf24; --warn-soft: #2d2008; --bad: #f87171; --bad-soft: #2c1010; --on-bad: #0a0f1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0a0f1c; --surface: #111827; --sunken: #0d1424; --line: #1f2937; --line-strong: #334155;
    --fg: #f1f5f9; --muted: #a3b1c6; --faint: #8090a6;
    --accent: #818cf8; --accent-hover: #a5b4fc; --accent-soft: #1e1b4b; --on-accent: #0a0f1c;
    --good: #34d399; --good-soft: #052e22; --warn: #fbbf24; --warn-soft: #2d2008; --bad: #f87171; --bad-soft: #2c1010; --on-bad: #0a0f1c;
    color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; } /* "hidden" must always win over display rules */
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* App bar (same as dashboard) */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-inner { max-width: 1100px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 20px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--fg); text-decoration: none; }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo-mark span { width: 12px; height: 4px; background: var(--on-accent); border-radius: 2px; box-shadow: 0 -6px 0 var(--on-accent), 0 6px 0 var(--on-accent); }
nav.main { display: flex; gap: 4px; }
nav.main a { padding: 7px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); text-decoration: none; font-size: 14px; }
nav.main a:hover { background: var(--sunken); color: var(--fg); }
nav.main a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
@media (max-width: 560px) { .logo .word { display: none; } nav.main a { padding: 7px 8px; } }

/* Page */
.page { max-width: 1100px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .page { grid-template-columns: 1fr; gap: 16px; } }
.page-head { grid-column: 1 / -1; }
.page-head h1 { font-size: clamp(24px, 3vw, 30px); font-weight: 700; }
.page-head p { color: var(--muted); margin-top: 4px; }

.index { position: sticky; top: 76px; display: grid; gap: 2px; }
.index a { padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; text-decoration: none; font-size: 14px; }
.index a:hover { background: var(--surface); color: var(--fg); }
.index a.danger { color: var(--bad); }
@media (max-width: 820px) { .index { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; } .index a { white-space: nowrap; background: var(--surface); border: 1px solid var(--line); } }

.sections { display: grid; gap: 20px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; display: grid; gap: 18px; min-width: 0; }
.card-head { display: grid; gap: 4px; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.card-head p { color: var(--muted); font-size: 13.5px; max-width: 62ch; }
.card.danger-zone { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.card.danger-zone h2 { color: var(--bad); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Forms */
.row { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 8px 20px; align-items: start; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
.row > .lbl { font-weight: 600; font-size: 13.5px; padding-top: 9px; }
.row > .lbl small { display: block; font-weight: 400; color: var(--faint); font-size: 12.5px; margin-top: 2px; }
.control { display: grid; gap: 8px; min-width: 0; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline input { flex: 1 1 220px; }
input[type="text"], input[type="email"], input[type="password"] {
  height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); min-width: 0; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[aria-invalid="true"] { border-color: var(--bad); }
input:disabled { background: var(--sunken); color: var(--muted); }
.code-input { font-family: var(--font-mono); font-size: 20px !important; letter-spacing: .4em; text-align: center; max-width: 200px; }
.stack { display: grid; gap: 10px; max-width: 420px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--fg); transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); color: var(--on-bad); border-color: var(--bad); }
.btn-ghost-danger { color: var(--bad); }
.btn-ghost-danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.linkbtn { border: 0; background: none; padding: 0; font-weight: 600; color: var(--accent); cursor: pointer; }
.linkbtn:hover:not(:disabled) { text-decoration: underline; }
.linkbtn:disabled { color: var(--faint); cursor: default; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.msg { font-size: 13px; min-height: 0; }
.msg:empty { display: none; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--good); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.value { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 8px; font-weight: 500; overflow-wrap: anywhere; }
.help { font-size: 12.5px; color: var(--faint); }
.subpanel { border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.strength { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 420px; }
.strength i { height: 4px; border-radius: 2px; background: var(--line); }
.strength[data-score="1"] i:nth-child(-n+1) { background: var(--bad); }
.strength[data-score="2"] i:nth-child(-n+2) { background: var(--warn); }
.strength[data-score="3"] i:nth-child(-n+3) { background: var(--good); }
.strength[data-score="4"] i { background: var(--good); }

.profile-top { display: flex; align-items: center; gap: 16px; }

/* Appearance picker */
.theme-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .theme-options { grid-template-columns: 1fr; } }
.theme-option { position: relative; display: grid; gap: 10px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
.theme-option:hover { border-color: var(--line-strong); }
.theme-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.theme-option:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.theme-option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-label { display: grid; gap: 1px; }
.theme-label b { font-size: 14px; display: flex; align-items: center; gap: 6px; }
.theme-option:has(input:checked) .theme-label b::after { content: "✓"; color: var(--accent); font-size: 13px; }
.theme-label small { color: var(--faint); font-size: 12.5px; }
/* Mini window previews use fixed colors on purpose: they show each theme, whatever the current one is. */
.theme-preview { display: grid; gap: 6px; padding: 8px; border-radius: 8px; height: 76px; align-content: start; border: 1px solid rgba(100,116,139,.25); }
.theme-preview .tp-bar { height: 8px; border-radius: 3px; width: 55%; }
.theme-preview .tp-row { display: flex; gap: 6px; }
.theme-preview i { display: block; height: 14px; border-radius: 4px; }
.theme-preview i.a { width: 40%; } .theme-preview i.b { width: 30%; } .theme-preview i.c { width: 65%; }
.theme-preview.light { background: #f8fafc; } .theme-preview.light .tp-bar { background: #cbd5e1; }
.theme-preview.light i.a { background: #c7d2fe; } .theme-preview.light i.b { background: #a7f3d0; } .theme-preview.light i.c { background: #fed7aa; }
.theme-preview.dark { background: #0a0f1c; } .theme-preview.dark .tp-bar { background: #334155; }
.theme-preview.dark i.a { background: #4338ca; } .theme-preview.dark i.b { background: #047857; } .theme-preview.dark i.c { background: #9a3412; }
.theme-preview.system { background: linear-gradient(135deg, #f8fafc 50%, #0a0f1c 50%); }
.theme-preview.system .tp-bar { background: #94a3b8; }
.theme-preview.system i.a { background: #818cf8; } .theme-preview.system i.b { background: #34d399; } .theme-preview.system i.c { background: #fb923c; }
.avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; flex: none; }
.profile-top b { display: block; font-size: 16px; }
.profile-top span { color: var(--faint); font-size: 13px; }

/* Sessions / devices */
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.dev-ico { width: 36px; height: 36px; border-radius: 9px; background: var(--sunken); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.dev-ico svg { width: 18px; height: 18px; }
.list .name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list .when { font-size: 12.5px; color: var(--faint); }
.list-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.empty { color: var(--faint); font-size: 13.5px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500; z-index: 50; max-width: calc(100vw - 32px); }
.loading { color: var(--faint); padding: 40px 0; grid-column: 1 / -1; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 2s !important; } }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <a class="logo" href="/dashboard"><span class="logo-mark" aria-hidden="true"><span></span></span><span class="word">Dayblock</span></a>
    <nav class="main" aria-label="Main">
      <a href="/dashboard">Dashboard</a>
      <a href="/planner">Planner</a>
      <a href="/settings" aria-current="page">Settings</a>
      <a href="/guide">Guide</a>
    </nav>
    <span class="spacer"></span>
    <span class="avatar" id="barAvatar" aria-hidden="true"></span>
    <button class="btn btn-sm" id="logoutBtn" type="button">Log out</button>
  </div>
</header>

<main class="page" id="page">
  <div class="page-head">
    <h1>Account settings</h1>
    <p>Manage your profile, sign-in security and data.</p>
  </div>
  <p class="loading" id="loading">Loading your account…</p>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k === "style") n.style.cssText = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return n;
  }
  async function api(path, body, method) {
    const res = await fetch(path, {
      method: method || (body ? "POST" : "GET"), credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401 && !path.includes("/delete")) { location.replace("/login?next=/settings"); throw new Error("Logged out"); }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(j.error || `Request failed (${res.status}).`); e.status = res.status; throw e; }
    return { status: res.status, ...j };
  }
  function busy(btn, on, label) {
    if (on) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = ""; btn.append(el("span", { class: "spin", "aria-hidden": "true" }), label || "Saving…"); }
    else { btn.disabled = false; btn.textContent = btn.dataset.label || btn.textContent; }
  }
  function setMsg(node, text, kind) { node.className = "msg" + (kind ? " " + kind : ""); node.textContent = text || ""; }
  let toastTimer;
  function toast(text) {
    let t = document.querySelector(".toast");
    if (!t) { t = el("div", { class: "toast", role: "status" }); document.body.append(t); }
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
  }
  const fmtDate = (ms) => (ms ? new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }) : "unknown date");
  function ago(ms) {
    if (!ms) return "a while ago";
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 90) return "just now";
    const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60); if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
    const d = Math.round(h / 24); return `${d} day${d === 1 ? "" : "s"} ago`;
  }
  function scorePw(pw) {
    let s = 0;
    if (pw.length >= 8) s++; if (pw.length >= 12) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
    if (/[0-9]/.test(pw) && /[^a-zA-Z0-9]/.test(pw)) s++;
    return pw ? Math.max(1, s) : 0;
  }
  function deviceIcon(label) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS(ns, "path");
    const phone = /iOS|Android/.test(label);
    path.setAttribute("d", phone ? "M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm3 17h2" : "M3 5h18v11H3zM8 20h8M12 16v4");
    path.setAttribute("fill", "none"); path.setAttribute("stroke", "currentColor"); path.setAttribute("stroke-width", "1.7"); path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
    svg.append(path); return svg;
  }

  let account = null;

  $("logoutBtn").addEventListener("click", async () => {
    try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } finally { location.replace("/login"); }
  });

  function render() {
    const { user } = account;
    $("barAvatar").textContent = user.name.trim().charAt(0).toUpperCase();
    const page = $("page");
    page.querySelectorAll(".index, .sections, .loading").forEach((n) => n.remove());

    page.append(el("nav", { class: "index", "aria-label": "Settings sections" },
      el("a", { href: "#profile" }, "Profile"),
      el("a", { href: "#appearance" }, "Appearance"),
      el("a", { href: "#password" }, "Password"),
      el("a", { href: "#sessions" }, "Where you're logged in"),
      el("a", { href: "#devices" }, "Trusted devices"),
      el("a", { href: "#data" }, "Your data"),
      el("a", { href: "#delete", class: "danger" }, "Delete account")));

    const sections = el("div", { class: "sections" });
    page.append(sections);
    sections.append(profileCard(), appearanceCard(), passwordCard(), sessionsCard(), devicesCard(), dataCard(), deleteCard());
  }

  /* ---------- Profile: name + email ---------- */
  function profileCard() {
    const { user } = account;
    const nameInput = el("input", { type: "text", id: "nameInput", value: user.name, maxlength: "60", autocomplete: "name" });
    const nameBtn = el("button", { class: "btn btn-primary", type: "submit", disabled: true }, "Save");
    const nameMsg = el("p", { class: "msg", role: "status" });
    nameInput.addEventListener("input", () => { nameBtn.disabled = !nameInput.value.trim() || nameInput.value.trim() === account.user.name; setMsg(nameMsg, ""); });
    const nameForm = el("form", { class: "control", novalidate: true }, el("div", { class: "inline" }, nameInput, nameBtn), nameMsg);
    nameForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) { setMsg(nameMsg, "Enter your name.", "err"); return; }
      busy(nameBtn, true);
      try {
        const r = await api("/api/account/name", { name });
        account.user = r.user;
        $("profName").textContent = r.user.name; $("profAvatar").textContent = r.user.name.charAt(0).toUpperCase(); $("barAvatar").textContent = r.user.name.charAt(0).toUpperCase();
        setMsg(nameMsg, "Name updated.", "ok");
      } catch (err) { setMsg(nameMsg, err.message, "err"); }
      finally { busy(nameBtn, false); nameBtn.disabled = true; }
    });

    // Email: shows current + a change flow (new email + password -> code to new email -> verify)
    const emailValue = el("div", { class: "value" }, el("span", { id: "emailText", text: user.email }), el("span", { class: "pill good", text: "Verified" }),
      el("button", { class: "linkbtn", type: "button", id: "changeEmailBtn", onclick: () => openEmailChange() }, "Change email"));
    const emailPanel = el("div", { class: "subpanel", id: "emailPanel", hidden: true });
    const emailControl = el("div", { class: "control" }, emailValue, emailPanel);

    return el("section", { class: "card", id: "profile", "aria-labelledby": "profileTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "profileTitle", text: "Profile" })),
      el("div", { class: "profile-top" },
        el("div", { class: "avatar-lg", id: "profAvatar", "aria-hidden": "true", text: user.name.charAt(0).toUpperCase() }),
        el("div", null, el("b", { id: "profName", text: user.name }), el("span", { text: `Member since ${fmtDate(Date.parse(user.createdAt))}` }))),
      el("hr", { class: "sep" }),
      el("div", { class: "row" }, el("label", { class: "lbl", for: "nameInput" }, "Name", el("small", { text: "Shown on your dashboard" })), nameForm),
      el("div", { class: "row" }, el("div", { class: "lbl" }, "Email", el("small", { text: "Used to log in and for codes" })), emailControl));
  }

  let emailChallenge = null, emailCooldown = null;
  function openEmailChange() {
    const panel = $("emailPanel");
    panel.hidden = false; panel.textContent = "";
    $("changeEmailBtn").hidden = true;
    const newEmail = el("input", { type: "email", id: "newEmail", autocomplete: "email", maxlength: "254", placeholder: "new@example.com" });
    const pw = el("input", { type: "password", id: "emailPw", autocomplete: "current-password" });
    const msg = el("p", { class: "msg", role: "alert" });
    const send = el("button", { class: "btn btn-primary btn-sm", type: "submit" }, "Send code");
    const form = el("form", { class: "stack", novalidate: true },
      el("div", { class: "field" }, el("label", { for: "newEmail" }, "New email"), newEmail),
      el("div", { class: "field" }, el("label", { for: "emailPw" }, "Current password"), pw),
      el("p", { class: "help", text: "We'll send a code to the new address. Your email only changes after you enter it." }),
      msg,
      el("div", { class: "inline" }, send, el("button", { class: "btn btn-sm", type: "button", onclick: closeEmailChange }, "Cancel")));
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); setMsg(msg, "");
      const email = newEmail.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { setMsg(msg, "Enter a valid email address.", "err"); newEmail.focus(); return; }
      if (!pw.value) { setMsg(msg, "Enter your current password.", "err"); pw.focus(); return; }
      busy(send, true, "Sending…");
      try {
        const r = await api("/api/account/email", { email, password: pw.value });
        emailChallenge = r.challenge;
        showEmailCode(r);
      } catch (err) { setMsg(msg, err.message, "err"); busy(send, false); }
    });
    panel.append(form);
    newEmail.focus();
  }
  function showEmailCode(r) {
    const panel = $("emailPanel");
    panel.textContent = "";
    const code = el("input", { type: "text", class: "code-input", id: "emailCode", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "7", placeholder: "000000", "aria-label": "6-digit code" });
    const msg = el("p", { class: "msg", role: "alert" });
    const verify = el("button", { class: "btn btn-primary btn-sm", type: "submit" }, "Verify");
    const resend = el("button", { class: "linkbtn", type: "button" }, "Resend code");
    const form = el("form", { class: "stack", novalidate: true },
      el("p", null, `Enter the 6-digit code we sent to `, el("b", { text: r.email }), "."),
      r.devMode ? el("p", { class: "help", text: "Development mode: the code was printed in the server console." }) : null,
      el("div", { class: "inline" }, code, verify),
      msg,
      el("div", { class: "inline" }, resend, el("span", { class: "help", text: "·" }), el("button", { class: "linkbtn", type: "button", onclick: closeEmailChange }, "Cancel")));
    code.addEventListener("input", () => { code.value = code.value.replace(/\D/g, "").slice(0, 6); setMsg(msg, ""); if (code.value.length === 6) form.requestSubmit(); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (code.value.length !== 6) { setMsg(msg, "Enter all 6 digits.", "err"); return; }
      busy(verify, true, "Verifying…");
      try {
        const res = await api("/api/account/email/verify", { challenge: emailChallenge, code: code.value });
        account.user = res.user;
        $("emailText").textContent = res.user.email;
        closeEmailChange();
        toast(`Email changed to ${res.user.email}. A notice was sent to your old address.`);
      } catch (err) {
        setMsg(msg, err.message, "err"); busy(verify, false); code.select();
        if (err.status === 410 || /Start again/.test(err.message)) setTimeout(openEmailChange, 1800);
      }
    });
    const cooldown = (sec) => {
      clearInterval(emailCooldown); let left = sec;
      const tick = () => { if (left <= 0) { clearInterval(emailCooldown); resend.disabled = false; resend.textContent = "Resend code"; return; } resend.disabled = true; resend.textContent = `Resend code in ${left--}s`; };
      tick(); emailCooldown = setInterval(tick, 1000);
    };
    resend.addEventListener("click", async () => {
      resend.disabled = true;
      try { await api("/api/auth/resend", { challenge: emailChallenge }); setMsg(msg, "New code sent.", "ok"); cooldown(60); }
      catch (err) { setMsg(msg, err.message, "err"); resend.disabled = false; }
    });
    panel.append(form);
    cooldown(60);
    code.focus();
  }
  function closeEmailChange() {
    clearInterval(emailCooldown); emailChallenge = null;
    const panel = $("emailPanel"); panel.hidden = true; panel.textContent = "";
    $("changeEmailBtn").hidden = false;
  }

  /* ---------- Appearance: System / Light / Dark ---------- */
  const THEME_KEY = "dayblock.theme";
  function savedTheme() { try { const t = localStorage.getItem(THEME_KEY); return t === "light" || t === "dark" ? t : "system"; } catch { return "system"; } }
  function applyTheme(choice) {
    const r = document.documentElement;
    try { if (choice === "system") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, choice); } catch {}
    if (choice === "system") { r.removeAttribute("data-theme"); r.removeAttribute("data-theme-by"); }
    else { r.setAttribute("data-theme", choice); r.setAttribute("data-theme-by", "dayblock"); }
  }
  function appearanceCard() {
    const current = savedTheme();
    const options = [
      ["system", "System", "Match this device's setting"],
      ["light", "Light", "Bright background"],
      ["dark", "Dark", "Easier on the eyes at night"],
    ];
    const status = el("p", { class: "msg", role: "status" });
    const group = el("div", { class: "theme-options", role: "radiogroup", "aria-label": "Theme" },
      options.map(([value, label, hint]) => {
        const input = el("input", { type: "radio", name: "theme", value, id: `theme-${value}`, checked: value === current });
        input.addEventListener("change", () => {
          applyTheme(value);
          setMsg(status, value === "system" ? "Following your device's light or dark setting." : `${label} mode is on for every Dayblock page on this device.`, "ok");
        });
        return el("label", { class: "theme-option", for: `theme-${value}` },
          input,
          el("span", { class: `theme-preview ${value}`, "aria-hidden": "true" },
            el("span", { class: "tp-bar" }), el("span", { class: "tp-row" }, el("i", { class: "a" }), el("i", { class: "b" })), el("span", { class: "tp-row" }, el("i", { class: "c" }))),
          el("span", { class: "theme-label" }, el("b", { text: label }), el("small", { text: hint })));
      }));
    return el("section", { class: "card", id: "appearance", "aria-labelledby": "appTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "appTitle", text: "Appearance" }),
        el("p", { text: "Choose how Dayblock looks. This applies to every page on this device." })),
      group, status);
  }

  /* ---------- Password ---------- */
  function passwordCard() {
    const cur = el("input", { type: "password", id: "pwCur", autocomplete: "current-password" });
    const next = el("input", { type: "password", id: "pwNext", autocomplete: "new-password", maxlength: "200" });
    const conf = el("input", { type: "password", id: "pwConf", autocomplete: "new-password", maxlength: "200" });
    const meter = el("div", { class: "strength", "data-score": "0", "aria-hidden": "true" }, el("i"), el("i"), el("i"), el("i"));
    next.addEventListener("input", () => (meter.dataset.score = String(scorePw(next.value))));
    const msg = el("p", { class: "msg", role: "status" });
    const btn = el("button", { class: "btn btn-primary", type: "submit" }, "Update password");
    const form = el("form", { class: "stack", novalidate: true },
      el("div", { class: "field" }, el("label", { for: "pwCur" }, "Current password"), cur),
      el("div", { class: "field" }, el("label", { for: "pwNext" }, "New password"), next, meter, el("span", { class: "help", text: "At least 8 characters, with letters and a number or symbol." })),
      el("div", { class: "field" }, el("label", { for: "pwConf" }, "Confirm new password"), conf),
      msg, el("div", null, btn));
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); setMsg(msg, "");
      if (!cur.value) { setMsg(msg, "Enter your current password.", "err"); cur.focus(); return; }
      if (next.value.length < 8 || !/[a-zA-Z]/.test(next.value) || !/[0-9\W_]/.test(next.value)) { setMsg(msg, "Use at least 8 characters, with letters and a number or symbol.", "err"); next.focus(); return; }
      if (next.value !== conf.value) { setMsg(msg, "New passwords don't match.", "err"); conf.focus(); return; }
      busy(btn, true, "Updating…");
      try {
        await api("/api/auth/password", { current: cur.value, next: next.value });
        form.reset(); meter.dataset.score = "0";
        setMsg(msg, "Password updated. You've been logged out everywhere else, and trusted devices will need a code again.", "ok");
        refreshLists();
      } catch (err) { setMsg(msg, err.message, "err"); }
      finally { busy(btn, false); }
    });
    return el("section", { class: "card", id: "password", "aria-labelledby": "pwTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "pwTitle", text: "Password" }),
        el("p", { text: "Changing your password logs you out on every other device." })),
      form);
  }

  /* ---------- Sessions ---------- */
  function sessionsCard() {
    return el("section", { class: "card", id: "sessions", "aria-labelledby": "sessTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "sessTitle", text: "Where you're logged in" }),
        el("p", { text: "Devices that are logged in to your account right now. Log out any you don't recognize, then change your password." })),
      el("div", { id: "sessionsBody" }));
  }
  function renderSessions() {
    const body = $("sessionsBody"); body.textContent = "";
    const list = el("ul", { class: "list" });
    account.sessions.forEach((s) => {
      const out = el("button", { class: "btn btn-sm", type: "button" }, "Log out");
      out.addEventListener("click", async () => {
        busy(out, true, "…");
        try { const r = await api("/api/account/sessions/revoke", { id: s.id }); account.sessions = r.sessions; renderSessions(); toast(`Logged out ${s.device}.`); }
        catch (err) { toast(err.message); busy(out, false); }
      });
      list.append(el("li", null,
        el("span", { class: "dev-ico" }, deviceIcon(s.device)),
        el("div", null,
          el("div", { class: "name" }, s.device, s.current ? el("span", { class: "pill accent", text: "This device" }) : null),
          el("div", { class: "when", text: `${s.current ? "Active now" : `Last active ${ago(s.lastSeen)}`} · Logged in ${fmtDate(s.created)}` })),
        s.current ? el("span") : out));
    });
    body.append(list);
    const others = account.sessions.filter((s) => !s.current).length;
    if (others || account.otherSessionsUnknown) {
      const all = el("button", { class: "btn btn-sm btn-ghost-danger", type: "button" }, others ? `Log out of ${others} other device${others === 1 ? "" : "s"}` : "Log out of all other devices");
      all.addEventListener("click", async () => {
        busy(all, true, "Logging out…");
        try { const r = await api("/api/account/sessions/revoke-others", {}); account.sessions = r.sessions; renderSessions(); toast("Logged out of all other devices."); }
        catch (err) { toast(err.message); busy(all, false); }
      });
      body.append(el("div", { class: "list-foot", style: "margin-top:14px" }, el("span", { class: "help", text: "You'll stay logged in here." }), all));
    }
  }

  /* ---------- Trusted devices ---------- */
  function devicesCard() {
    return el("section", { class: "card", id: "devices", "aria-labelledby": "devTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "devTitle", text: "Trusted devices" }),
        el("p", { text: "When you log in, we email you a code. Devices where you ticked “Don't ask for a code on this device” skip that step for 30 days." })),
      el("div", { id: "devicesBody" }));
  }
  function renderDevices() {
    const body = $("devicesBody"); body.textContent = "";
    if (!account.devices.length) {
      body.append(el("p", { class: "empty", text: "No trusted devices. Every login asks for an email code." }));
      return;
    }
    body.append(el("ul", { class: "list" }, account.devices.map((d) => el("li", null,
      el("span", { class: "dev-ico" }, deviceIcon(d.device)),
      el("div", null,
        el("div", { class: "name" }, d.device, d.current ? el("span", { class: "pill accent", text: "This device" }) : null),
        el("div", { class: "when", text: `Trusted ${d.created ? fmtDate(d.created) : "earlier"} · Expires ${fmtDate(d.expires)}` })),
      el("span")))));
    let armed = false;
    const forget = el("button", { class: "btn btn-sm btn-ghost-danger", type: "button" }, "Forget all trusted devices");
    forget.addEventListener("click", async () => {
      if (!armed) { armed = true; forget.textContent = "Click again to confirm"; setTimeout(() => { armed = false; forget.textContent = "Forget all trusted devices"; }, 3500); return; }
      busy(forget, true, "Forgetting…");
      try { await api("/api/account/devices/forget", {}); account.devices = []; renderDevices(); toast("All devices will ask for a code at the next login."); }
      catch (err) { toast(err.message); busy(forget, false); }
    });
    body.append(el("div", { class: "list-foot", style: "margin-top:14px" }, el("span", { class: "help", text: "Each one will need an email code at its next login." }), forget));
  }

  /* ---------- Data ---------- */
  function dataCard() {
    return el("section", { class: "card", id: "data", "aria-labelledby": "dataTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "dataTitle", text: "Your data" }),
        el("p", null, "Download a copy of your account details and every task and event in your planner, as a JSON file. ",
          "See the ", el("a", { href: "/privacy" }, "Privacy Policy"), " for what Dayblock stores and why.")),
      el("div", null, el("a", { class: "btn", href: "/api/account/export", download: "" }, "Download my data")));
  }

  /* ---------- Delete account ---------- */
  function deleteCard() {
    const pw = el("input", { type: "password", id: "delPw", autocomplete: "current-password" });
    const confirmInput = el("input", { type: "text", id: "delConfirm", autocomplete: "off", spellcheck: "false", placeholder: "DELETE" });
    const msg = el("p", { class: "msg", role: "alert" });
    const btn = el("button", { class: "btn btn-danger", type: "submit", disabled: true }, "Delete my account");
    const sync = () => { btn.disabled = !(confirmInput.value === "DELETE" && pw.value); };
    pw.addEventListener("input", sync); confirmInput.addEventListener("input", sync);
    const form = el("form", { class: "stack", novalidate: true },
      el("div", { class: "field" }, el("label", { for: "delPw" }, "Your password"), pw),
      el("div", { class: "field" }, el("label", { for: "delConfirm" }, "Type DELETE to confirm"), confirmInput),
      msg, el("div", null, btn));
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); setMsg(msg, "");
      busy(btn, true, "Deleting…");
      try {
        await api("/api/account/delete", { password: pw.value, confirm: confirmInput.value });
        location.replace("/signup");
      } catch (err) { setMsg(msg, err.message, "err"); busy(btn, false); sync(); }
    });
    return el("section", { class: "card danger-zone", id: "delete", "aria-labelledby": "delTitle" },
      el("div", { class: "card-head" }, el("h2", { id: "delTitle", text: "Delete account" }),
        el("p", { text: "This permanently deletes your account, your planner and every task in it, and logs you out everywhere. It can't be undone. Download your data first if you want a copy." })),
      form);
  }

  async function refreshLists() {
    try { const r = await api("/api/account"); account.sessions = r.sessions; account.devices = r.devices; renderSessions(); renderDevices(); } catch {}
  }

  /* ---------- Boot ---------- */
  (async () => {
    try {
      account = await api("/api/account");
      render(); renderSessions(); renderDevices();
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    } catch (err) {
      if (err.message !== "Logged out") $("loading").textContent = `Couldn't load your settings: ${err.message}`;
    }
  })();
})();
</script>
</body>
</html>
